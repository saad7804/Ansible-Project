
---
- name: Create ContentSphere S3 bucket and upload test file
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: ap-south-1
    bucket_name: "{{ lookup('ansible.builtin.env', 'CONTENTSPHERE_BUCKET_NAME') }}"
    local_file: "{{ playbook_dir }}/../files/contentsphere-test.txt"
    object_key: contentsphere-test.txt

  tasks:
    - name: Create S3 bucket
      amazon.aws.s3_bucket:
        name: "{{ bucket_name }}"
        region: "{{ aws_region }}"
        state: present
        tags:
          Project: ContentSphere-Ansible-Task6
          ManagedBy: Ansible

    - name: Upload ContentSphere test file
      amazon.aws.s3_object:
        bucket: "{{ bucket_name }}"
        object: "{{ object_key }}"
        src: "{{ local_file }}"
        mode: put
        region: "{{ aws_region }}"

    - name: Verify uploaded object exists
      amazon.aws.s3_object:
        bucket: "{{ bucket_name }}"
        object: "{{ object_key }}"
        mode: getstr
        region: "{{ aws_region }}"
      register: uploaded_object

    - name: Display S3 verification result
      ansible.builtin.debug:
        msg:
          - "Bucket: {{ bucket_name }}"
          - "Object: {{ object_key }}"
          - "File uploaded and checked."
